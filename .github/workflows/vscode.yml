name: VS Code extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: VSIX (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-14
            target: darwin-arm64
          - runner: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: atompack-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: atompack-vscode/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # Packaging keeps normal compiler warnings (main has a non-Linux
          # unused `populate` parameter). The existing Rust CI enforces Clippy.
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: atompack-vscode-${{ matrix.target }}
          path: atompack-vscode/*-${{ matrix.target }}-*.vsix
          if-no-files-found: error
